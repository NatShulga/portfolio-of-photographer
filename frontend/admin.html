<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления | Фотограф</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; font-size: 1.5rem; text-align: center; color: #0f172a; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; margin-bottom: 1.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        input[type="file"] { padding: 5px; background: #f1f5f9; cursor: pointer; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 1rem; padding: 10px; border-radius: 6px; text-align: center; display: none; font-size: 0.9rem; }
        .success { background: #dcfce7; color: #166534; display: block !important; }
        .error { background: #fee2e2; color: #991b1b; display: block !important; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Добавить фото</h2>
    <form id="uploadForm">
        <label>Название</label>
        <input type="text" id="title" placeholder="Например: Улыбка леса" required>

        <label>Категория</label>
        <select id="category">
            <option value="wedding & love story">wedding & love story</option>
            <option value="individual">individual</option>
            <option value="family">family</option>
            <option value="event">event</option>
            <option value="children birthday">children birthday</option>
            <option value="street style">street style</option>
        </select>

        <label>Фотография</label>
        <input type="file" id="photoFile" accept="image/*" required>

        <button type="submit" id="submitBtn">Опубликовать</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const form = document.getElementById('uploadForm');
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.onsubmit = async (e) => {
        e.preventDefault();
        
        status.className = '';
        status.innerText = 'Загрузка фото в облако...';
        status.style.display = 'block';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('title', document.getElementById('title').value);
        formData.append('category', document.getElementById('category').value);
        formData.append('photo', document.getElementById('photoFile').files[0]);

        try {
            // URL бэкенда на Render
            const response = await fetch('https://portfolio-of-photographer.onrender.com/api/photos', {
                method: 'POST',
                body: formData // Для файлов используем FormData, а не JSON
            });

            if (response.ok) {
                status.className = 'success';
                status.innerText = 'Опубликовано в портфолио!';
                form.reset();
            } else {
                throw new Error('Сервер отклонил запрос');
            }
        } catch (err) {
            status.className = 'error';
            status.innerText = 'Ошибка: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
